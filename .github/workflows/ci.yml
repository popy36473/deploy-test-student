  name: CI - Continuous Integration

  on:
    push:
      branches: ["main", "master"]

    pull_request:
      branches: ["main", "master"]

    # Cho phép kích hoạt pipeline thủ công trên GitHub Actions
    workflow_dispatch:

  # Cấp quyền cho GitHub Actions
  permissions:
    contents: read
    packages: write

  jobs:
    build-and-test:
      name: Build & Test (Java 21 + Gradle + PostgreSQL)
      runs-on: ubuntu-latest

      # Khởi tạo PostgreSQL phục vụ kiểm thử
      services:
        postgres:
          image: postgres:17-alpine
          env:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: 110905
            POSTGRES_DB: student_db
          options: >-
            --health-cmd "pg_isready -U postgres -d student_db"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

      steps:
        # 1. Lấy source code từ GitHub
        - name: Checkout source code
          uses: actions/checkout@v4

        # 2. Cài đặt JDK 21
        - name: Set up JDK 21 (Eclipse Temurin)
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: gradle

        # 3. Cấp quyền thực thi cho Gradle Wrapper
        - name: Grant execute permission for gradlew
          run: chmod +x gradlew

        # 4. Chạy Unit Test và Integration Test
        - name: Run Unit & Integration Tests
          env:
            SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/student_db
            SPRING_DATASOURCE_USERNAME: postgres
            SPRING_DATASOURCE_PASSWORD: 110905
          run: ./gradlew test

        # 5. Build Spring Boot JAR
        - name: Build Spring Boot JAR Package
          run: ./gradlew bootJar -x test

        # 6. Thiết lập Docker Buildx
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        # 7. Đăng nhập GitHub Container Registry
        - name: Login to GitHub Container Registry
          if: github.event_name != 'pull_request'
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        # 8. Build và Push Docker Image lên GHCR
        - name: Build and Push Docker Image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: ${{ github.event_name != 'pull_request' }}
            tags: |
              ghcr.io/popy36473/student-backend:latest
              ghcr.io/popy36473/student-backend:${{ github.sha }}
            cache-from: type=gha
            cache-to: type=gha,mode=max
